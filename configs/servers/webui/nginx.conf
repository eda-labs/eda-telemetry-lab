user  nginx;
worker_processes  1;

pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 32;
}

http {
    # Logging to stdout for Docker
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;  # We can match any hostname

        #-----------------------------
        # Serve static files from:
        #    /usr/share/nginx/html
        #-----------------------------
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            # The control panel is exposed via EDA HttpProxy, which (26.8+) injects a restrictive
            # "default-src 'self'" CSP unless the backend sends its own.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        }

        #---------------------------------------------------------
        # REVERSE PROXY for Nokia SR Linux JSON-RPC
        #---------------------------------------------------------
        location ~ ^/proxy/(?<devip>\d+\.\d+\.\d+\.\d+)(?<rest>/.*)$ {
            proxy_pass        http://$devip$rest;
            proxy_http_version 1.1;
            # NokiaSrl1! password as base64
            proxy_set_header  Authorization "Basic YWRtaW46Tm9raWFTcmwxIQ==";
        }
    }
}
