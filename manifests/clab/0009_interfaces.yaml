---
apiVersion: interfaces.eda.nokia.com/v1
kind: Interface
metadata:
  labels:
    eda.nokia.com/macvrf201: "true"
    eda.nokia.com/macvrf1001: "true"
    eda.nokia.com/role: edge
  name: lag1-l1-l2-eth-1-1
  namespace: eda-telemetry
spec:
  enabled: true
  encapType: Dot1q
  ethernet:
    speed: 10G
  lag:
    lacp:
      interval: Fast
      mode: Active
      systemPriority: 32768
    minLinks: 1
    multihoming:
      esi: auto
      mode: AllActive
      reloadDelayTimerSeconds: 100
      revertive: false
    type: LACP
  lldp: true
  members:
    - enabled: true
      interface: ethernet-1-1
      lacpPortPriority: 32768
      node: leaf1
    - enabled: true
      interface: ethernet-1-1
      lacpPortPriority: 32768
      node: leaf2
  type: LAG

